[project]
name = "ocr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "accelerate",
    "landingai-ade",
    "paddleocr[all]",
    "paddlepaddle-gpu==3.3.1",
    "pymupdf",
    "torch",
    "torchvision",
    "transformers",
    "llama-cloud>=2.1",
    "mistralai",
    "chandra-ocr[hf]",
    "flash-linear-attention[cuda]",
    "openai",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu130" }

[[tool.uv.index]]
name = "paddle-cu130"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu130/"
explicit = true
